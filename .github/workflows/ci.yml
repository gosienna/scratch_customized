name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          cache: npm
          node-version-file: .nvmrc
      - uses: ./.github/actions/install-dependencies
      - name: Build packages the editor depends on
        run: |
          for package in task-herder scratch-storage scratch-svg-renderer scratch-render scratch-paint scratch-vm platform; do
            NODE_ENV=production npm run build --workspace="packages/$package"
          done
      - name: Platform (lint, unit, round-trip and differential tests)
        run: npm test --workspace=packages/platform
      - name: scratch-vm project transform hooks
        run: npx tap test/unit/virtual-machine_project-transforms.js --disable-coverage
        working-directory: packages/scratch-vm
      - name: scratch-gui lint
        run: npm run test:lint --workspace=packages/scratch-gui

  compatibility:
    name: Compatibility with official Scratch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          cache: npm
          node-version-file: .nvmrc
      - uses: ./.github/actions/install-dependencies
      # The tests produce the files under test with this repository's VM, which loads these packages' dist/.
      - name: Build this repository's packages
        run: |
          for package in task-herder scratch-storage scratch-svg-renderer scratch-render scratch-paint scratch-vm platform; do
            NODE_ENV=production npm run build --workspace="packages/$package"
          done
      - name: Install the compatibility suite (official scratch-vm from npm)
        run: npm ci
        working-directory: test/compat
      - name: Levels 1-2 (official validator, opcodes, references, behavior)
        run: npm test
        working-directory: test/compat
      - name: Cache the official GUI build
        uses: actions/cache@v4
        with:
          # .tag tells build-official-gui.sh that the cached build is current.
          path: |
            test/compat/.official-gui/build
            test/compat/.official-gui/.tag
          key: official-gui-${{ hashFiles('test/compat/scripts/build-official-gui.sh') }}
      - name: Build the official GUI
        run: npm run build:official-gui
        working-directory: test/compat
      - name: Level 3 (open every saved file in the official GUI)
        run: |
          npx playwright install --with-deps chromium
          npm run write-outputs
          npm run test:gui
        working-directory: test/compat
